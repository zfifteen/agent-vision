name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift test
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Validate manifests
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          plugin_path = pathlib.Path(".codex-plugin/plugin.json")
          mcp_path = pathlib.Path(".mcp.json")
          plugin = json.loads(plugin_path.read_text(encoding="utf-8"))
          mcp = json.loads(mcp_path.read_text(encoding="utf-8"))

          assert plugin["name"] == "agent-vision"
          assert plugin.get("version") == "1.5.0"
          # 1.5.0 / Ship A: no production MCP advertisement (eager-start hotfix).
          assert "mcpServers" not in plugin, "plugin.json must not advertise mcpServers"
          assert mcp.get("mcpServers", {}) == {}, ".mcp.json must have empty mcpServers"

          grok_plugin = pathlib.Path("hosts/grok/plugin.json")
          if grok_plugin.exists():
              gp = json.loads(grok_plugin.read_text(encoding="utf-8"))
              assert gp["name"] == "agent-vision"
              assert "mcpServers" not in gp
          skill = pathlib.Path("hosts/grok/skills/agent-vision/SKILL.md")
          if skill.exists():
              text = skill.read_text(encoding="utf-8")
              assert "name: agent-vision" in text
              assert "disable-model-invocation: false" in text
              assert "HARD GATE" in text
              assert "Topic is irrelevant" in text
              assert "FORBIDDEN" in text
              assert "USE THE IMAGE IN REASONING" in text or "use in reasoning" in text.lower()
              assert "as if blind" in text or "identical-to-blind" in text or "never looked" in text
          print("manifest validation OK")
          PY
      - name: Install dry-run
        run: scripts/install-local.sh --dry-run
      - name: Grok adapter static tests
        run: scripts/test-grok-adapter.sh
      - name: Sticky session state tests
        run: scripts/test-grok-sticky-state.sh
      - name: Stage capture helper for CLI error-path tests
        run: |
          mkdir -p dist
          cp scripts/agent-vision-capture-file.sh dist/agent-vision-capture-file
          chmod +x dist/agent-vision-capture-file
      - name: Capture helper CLI error paths
        run: scripts/test-capture-file-cli.sh
